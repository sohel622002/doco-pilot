name: Build & Push Images

# Builds and publishes Docker images for all three components to GitHub
# Container Registry (ghcr.io) using the built-in GITHUB_TOKEN — no extra
# secrets to configure. Triggered on version tags (v1.0.0 etc.) or manually.
#
# This publishes images; it does not deploy them anywhere. Wire up a final
# "pull + restart" step for your actual host (SSH, Railway/Render/Fly.io
# deploy hook, Watchtower, etc.) once you've picked a hosting platform —
# that step needs secrets specific to wherever you deploy.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: server
            context: ./server
          - name: agent
            context: ./agent
          - name: client
            context: ./client
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/doco-pilot-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Only consumed by the client build (Vite bakes these in at build
          # time); set as repo/environment secrets before relying on this.
          build-args: |
            VITE_BACKEND_API_URL=${{ secrets.VITE_BACKEND_API_URL }}
            VITE_BACKEND_WS=${{ secrets.VITE_BACKEND_WS }}
