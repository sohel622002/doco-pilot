name: E2E

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      # ubuntu-latest runners already have a working Docker daemon — the
      # runner IS the Docker host, so the real-agent tests can `docker run`
      # directly, same as on a laptop.
      BASE_URL: http://localhost:5173
      API_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply schema
        run: |
          DB_URL=$(supabase status -o env | grep DB_URL | cut -d= -f2 | tr -d '"')
          psql "$DB_URL" -f server/supabase-schema.sql

      - name: Write server .env
        run: |
          SUPA=$(supabase status -o env)
          echo "PORT=3001" >> server/.env
          echo "NODE_ENV=development" >> server/.env
          echo "FRONTEND_URL=http://localhost:5173" >> server/.env
          echo "JWT_SECRET=$(openssl rand -hex 32)" >> server/.env
          echo "JWT_EXPIRES_IN=15m" >> server/.env
          echo "MASTER_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> server/.env
          echo "SUPABASE_URL=$(echo "$SUPA" | grep API_URL | cut -d= -f2 | tr -d '"')" >> server/.env
          echo "SUPABASE_SERVICE_ROLE_KEY=$(echo "$SUPA" | grep SERVICE_ROLE_KEY | cut -d= -f2 | tr -d '"')" >> server/.env
          echo "BACKEND_WS_URL=ws://host.docker.internal:3001/ws" >> server/.env
          echo "AGENT_IMAGE=doco-pilot-agent:e2e" >> server/.env

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            e2e/package-lock.json

      - name: Build the agent image locally (so BACKEND_WS_URL points at a real, buildable image)
        run: docker build -t doco-pilot-agent:e2e ./agent

      - name: Install and start server
        working-directory: server
        run: |
          npm ci
          npm run build
          node dist/index.js &
          npx wait-on http://localhost:3001/health -t 30000

      - name: Install and start client
        working-directory: client
        env:
          VITE_BACKEND_API_URL: http://localhost:3001
          VITE_BACKEND_WS: ws://localhost:3001/ws
        run: |
          npm ci
          npm run build
          npx vite preview --port 5173 &
          npx wait-on http://localhost:5173 -t 30000

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e tests
        working-directory: e2e
        run: npm test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
